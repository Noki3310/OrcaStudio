name: Alpha Windows compilation
on:
  push:
    branches: [build/alpha-integration-bootstrap]
    paths: [.github/workflows/alpha_windows_compile.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d0ade5cd040b3cbfc665298dd645522115b236c
          lfs: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
      - uses: microsoft/setup-msbuild@v3
      - uses: actions/cache@v4
        with:
          path: deps/build
          key: alpha-msvc-x64-release-${{ runner.imageversion }}-${{ hashFiles('deps/**', '!deps/build/**', 'cmake/**') }}
      - name: Install NSIS packaging tool
        shell: powershell
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile full Alpha application with X1C controls
        shell: cmd
        run: build_win.bat --deps --slicer --installer --config release --arch x64 --jobs 2
      - name: Stage installer and verification information
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer-artifact | Out-Null
          $installers = @(Get-ChildItem build/OrcaSlicer_Windows_Installer_*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          Copy-Item $installers[0].FullName installer-artifact/OrcaStudio-Alpha-Integration-Test-Setup.exe
          $hash = Get-FileHash installer-artifact/OrcaStudio-Alpha-Integration-Test-Setup.exe -Algorithm SHA256
          "$($hash.Hash.ToLower())  OrcaStudio-Alpha-Integration-Test-Setup.exe" | Set-Content installer-artifact/SHA256SUMS.txt
          @"
          INSTALLATIONS-TESTSTAND, KEIN FERTIGES ORCASTUDIO-UPDATE
          Quellstand: 2d0ade5cd040b3cbfc665298dd645522115b236c
          Alpha-Oberflaeche und Python-Plugins enthalten.
          Direkte X1C-Anbindung ueber die OrcaStudio-Runtime noch nicht fertig integriert.
          Keine Freigabe fuer produktive Druckauftraege.
          Installer verwendet derzeit noch die Upstream-OrcaSlicer-Produktkennung.
          "@ | Set-Content installer-artifact/TESTSTAND.txt
      - name: Upload NSIS installer for installation testing
        uses: actions/upload-artifact@v4
        with:
          name: OrcaStudio-Alpha-Installer-Teststand
          path: installer-artifact/*
          if-no-files-found: error
      - name: Preserve compiled application for integration testing
        uses: actions/upload-artifact@v4
        with:
          name: alpha-windows-integration-test-only
          path: |
            build/src/Release/*.exe
            build/src/Release/*.dll
            build/src/Release/python/**
          if-no-files-found: error
      - name: Preserve configure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-windows-build-logs
          path: |
            build/**/CMakeConfigureLog.yaml
            deps/build/**/CMakeConfigureLog.yaml
          if-no-files-found: ignore
