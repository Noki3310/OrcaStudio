name: Alpha Windows compilation
on:
  push:
    branches: [build/alpha-integration-bootstrap]
    paths: [.github/workflows/alpha_windows_compile.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 097999e5d1ed96fba69aab6ff1a9ac8e8d63d733
      - name: Install runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev libssl-dev libcurl4-openssl-dev zlib1g-dev nlohmann-json3-dev libwebkit2gtk-4.1-dev dbus-x11 epiphany-browser libasound2t64 libpulse0 novnc openbox openssl websockify x11vnc xvfb
      - name: Run runtime regression tests
        run: |
          python3 tools/slicer_linux_runtime/test_http_request.py
          python3 tools/slicer_linux_runtime/test_runtime_dispatcher.py
          python3 tools/slicer_linux_runtime/test_print_params.py
          python3 tools/slicer_linux_runtime/test_runtime_abi.py
          python3 tools/slicer_linux_runtime/test_alpha_dispatch.py
          python3 tools/slicer_linux_runtime/test_drying_controls.py
          python3 tools/slicer_linux_runtime/test_drying_status.py
          python3 tools/slicer_linux_runtime/test_nozzle_settings.py
      - name: Build runtime hosts and authentication browser
        run: |
          cmake -S tools/slicer_linux_runtime_host -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target slicer_linux_runtime_host --parallel 2
      - name: Package and validate Linux runtime
        run: |
          bash tools/slicer_linux_runtime_host/package_linux_host_runtime.sh
          (cd tools/slicer_linux_runtime_host/runtime/linux-x86_64 && sha256sum -c runtime-files.sha256)
      - name: Cache validated guest filesystem
        uses: actions/cache@v4
        with:
          path: tools/slicer_linux_runtime/rootfs/windows-wsl2-rootfs.tar
          key: alpha-wsl-auth-v3-${{ hashFiles('tools/slicer_linux_runtime/rootfs/*.sh', 'tools/slicer_linux_runtime/rootfs/*.py') }}
      - name: Build and validate Windows guest filesystem
        run: |
          bash tools/slicer_linux_runtime/rootfs/build_windows_wsl_rootfs.sh
          python3 tools/slicer_linux_runtime/rootfs/validate_windows_wsl_rootfs.py tools/slicer_linux_runtime/rootfs/windows-wsl2-rootfs.tar ubuntu-24.04-linux-auth-v3
          mkdir -p runtime-artifact
          tar -czf runtime-artifact/linux-runtime.tar.gz -C tools/slicer_linux_runtime_host/runtime linux-x86_64
          cp tools/slicer_linux_runtime/rootfs/windows-wsl2-rootfs.tar runtime-artifact/
          printf '%s\n' '097999e5d1ed96fba69aab6ff1a9ac8e8d63d733' > runtime-artifact/SOURCE_COMMIT.txt
          (cd runtime-artifact && sha256sum linux-runtime.tar.gz windows-wsl2-rootfs.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-complete-runtime-payload
          path: runtime-artifact/
          if-no-files-found: error
  windows:
    needs: runtime
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a28858b585a532cc5f1d5834060c0c47063e7288
          lfs: false
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
      - uses: microsoft/setup-msbuild@v3
      - uses: actions/cache@v4
        with:
          path: deps/build
          key: alpha-msvc-x64-release-${{ runner.imageversion }}-${{ hashFiles('deps/**', '!deps/build/**', 'cmake/**') }}
      - name: Download verified runtime payload
        uses: actions/download-artifact@v4
        with:
          name: alpha-complete-runtime-payload
          path: runtime-download
      - name: Verify and stage runtime payload
        shell: powershell
        run: |
          $source = (Get-Content runtime-download/SOURCE_COMMIT.txt -Raw).Trim()
          if ($source -ne '097999e5d1ed96fba69aab6ff1a9ac8e8d63d733') { throw "Unexpected runtime source revision" }
          foreach ($line in Get-Content runtime-download/SHA256SUMS) {
            if ($line -notmatch '^([0-9a-f]{64})  (linux-runtime.tar.gz|windows-wsl2-rootfs.tar)
        shell: powershell
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile full Alpha application with X1C controls
        shell: cmd
        run: build_win.bat --deps --slicer --installer --config release --arch x64 --jobs 2 --slicer-args "-DORCASTUDIO_RUNTIME_PAYLOAD_DIR=%CD%/runtime-payload"
      - name: Stage installer and verification information
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer-artifact | Out-Null
          $installers = @(Get-ChildItem build/OrcaSlicer_Windows_Installer_*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          Copy-Item $installers[0].FullName installer-artifact/OrcaStudio-Alpha-Integration-Test-Setup.exe
          $hash = Get-FileHash installer-artifact/OrcaStudio-Alpha-Integration-Test-Setup.exe -Algorithm SHA256
          "$($hash.Hash.ToLower())  OrcaStudio-Alpha-Integration-Test-Setup.exe" | Set-Content installer-artifact/SHA256SUMS.txt
          @"
          INSTALLATIONS-TESTSTAND, KEIN FERTIGES ORCASTUDIO-UPDATE
          Quellstand: a28858b585a532cc5f1d5834060c0c47063e7288
          Alpha-Oberflaeche und Python-Plugins enthalten.
          Direkte X1C-Anbindung ueber die OrcaStudio-Runtime noch nicht fertig integriert.
          Keine Freigabe fuer produktive Druckauftraege.
          Installer verwendet derzeit noch die Upstream-OrcaSlicer-Produktkennung.
          "@ | Set-Content installer-artifact/TESTSTAND.txt
      - name: Upload NSIS installer for installation testing
        uses: actions/upload-artifact@v4
        with:
          name: OrcaStudio-Alpha-Installer-Teststand
          path: installer-artifact/*
          if-no-files-found: error
      - name: Preserve compiled application for integration testing
        uses: actions/upload-artifact@v4
        with:
          name: alpha-windows-integration-test-only
          path: |
            build/src/Release/*.exe
            build/src/Release/*.dll
            build/src/Release/python/**
          if-no-files-found: error
      - name: Preserve configure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-windows-build-logs
          path: |
            build/**/CMakeConfigureLog.yaml
            deps/build/**/CMakeConfigureLog.yaml
          if-no-files-found: ignore
) { throw "Invalid manifest entry" }
            $expected = $Matches[1]
            $actual = (Get-FileHash ("runtime-download/" + $Matches[2]) -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected) { throw "Runtime artifact hash mismatch" }
          }
          New-Item -ItemType Directory -Force runtime-payload | Out-Null
          tar -xzf runtime-download/linux-runtime.tar.gz -C runtime-payload --strip-components=1
          if ($LASTEXITCODE -ne 0) { throw "Runtime extraction failed" }
          Copy-Item runtime-download/windows-wsl2-rootfs.tar runtime-payload/
      - name: Install NSIS packaging tool
        shell: powershell
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile full Alpha application with X1C controls
        shell: cmd
        run: build_win.bat --deps --slicer --installer --config release --arch x64 --jobs 2
      - name: Stage installer and verification information
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force installer-artifact | Out-Null
          $installers = @(Get-ChildItem build/OrcaSlicer_Windows_Installer_*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          Copy-Item $installers[0].FullName installer-artifact/OrcaStudio-Alpha-Integration-Test-Setup.exe
          $hash = Get-FileHash installer-artifact/OrcaStudio-Alpha-Integration-Test-Setup.exe -Algorithm SHA256
          "$($hash.Hash.ToLower())  OrcaStudio-Alpha-Integration-Test-Setup.exe" | Set-Content installer-artifact/SHA256SUMS.txt
          @"
          INSTALLATIONS-TESTSTAND, KEIN FERTIGES ORCASTUDIO-UPDATE
          Quellstand: a28858b585a532cc5f1d5834060c0c47063e7288
          Alpha-Oberflaeche und Python-Plugins enthalten.
          Direkte X1C-Anbindung ueber die OrcaStudio-Runtime noch nicht fertig integriert.
          Keine Freigabe fuer produktive Druckauftraege.
          Installer verwendet derzeit noch die Upstream-OrcaSlicer-Produktkennung.
          "@ | Set-Content installer-artifact/TESTSTAND.txt
      - name: Upload NSIS installer for installation testing
        uses: actions/upload-artifact@v4
        with:
          name: OrcaStudio-Alpha-Installer-Teststand
          path: installer-artifact/*
          if-no-files-found: error
      - name: Preserve compiled application for integration testing
        uses: actions/upload-artifact@v4
        with:
          name: alpha-windows-integration-test-only
          path: |
            build/src/Release/*.exe
            build/src/Release/*.dll
            build/src/Release/python/**
          if-no-files-found: error
      - name: Preserve configure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-windows-build-logs
          path: |
            build/**/CMakeConfigureLog.yaml
            deps/build/**/CMakeConfigureLog.yaml
          if-no-files-found: ignore
