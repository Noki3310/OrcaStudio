name: Prepare full Alpha integration
on:
  push:
    branches: [build/alpha-integration-bootstrap]
    paths: [.github/workflows/prepare_alpha.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 097999e5d1ed96fba69aab6ff1a9ac8e8d63d733
      - name: Install runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev libssl-dev libcurl4-openssl-dev zlib1g-dev nlohmann-json3-dev libwebkit2gtk-4.1-dev dbus-x11 epiphany-browser libasound2t64 libpulse0 novnc openbox openssl websockify x11vnc xvfb
      - name: Run runtime regression tests
        run: |
          python3 tools/slicer_linux_runtime/test_http_request.py
          python3 tools/slicer_linux_runtime/test_runtime_dispatcher.py
          python3 tools/slicer_linux_runtime/test_print_params.py
          python3 tools/slicer_linux_runtime/test_runtime_abi.py
          python3 tools/slicer_linux_runtime/test_alpha_dispatch.py
          python3 tools/slicer_linux_runtime/test_drying_controls.py
          python3 tools/slicer_linux_runtime/test_drying_status.py
          python3 tools/slicer_linux_runtime/test_nozzle_settings.py
      - name: Build runtime hosts and authentication browser
        run: |
          cmake -S tools/slicer_linux_runtime_host -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target slicer_linux_runtime_host --parallel 2
      - name: Package and validate Linux runtime
        run: |
          bash tools/slicer_linux_runtime_host/package_linux_host_runtime.sh
          (cd tools/slicer_linux_runtime_host/runtime/linux-x86_64 && sha256sum -c runtime-files.sha256)
      - name: Cache validated guest filesystem
        uses: actions/cache@v4
        with:
          path: tools/slicer_linux_runtime/rootfs/windows-wsl2-rootfs.tar
          key: alpha-wsl-auth-v3-${{ hashFiles('tools/slicer_linux_runtime/rootfs/*.sh', 'tools/slicer_linux_runtime/rootfs/*.py') }}
      - name: Build and validate Windows guest filesystem
        run: |
          bash tools/slicer_linux_runtime/rootfs/build_windows_wsl_rootfs.sh
          python3 tools/slicer_linux_runtime/rootfs/validate_windows_wsl_rootfs.py tools/slicer_linux_runtime/rootfs/windows-wsl2-rootfs.tar ubuntu-24.04-linux-auth-v3
          mkdir -p runtime-artifact
          tar -czf runtime-artifact/linux-runtime.tar.gz -C tools/slicer_linux_runtime_host/runtime linux-x86_64
          cp tools/slicer_linux_runtime/rootfs/windows-wsl2-rootfs.tar runtime-artifact/
          printf '%s\n' '097999e5d1ed96fba69aab6ff1a9ac8e8d63d733' > runtime-artifact/SOURCE_COMMIT.txt
          (cd runtime-artifact && sha256sum linux-runtime.tar.gz windows-wsl2-rootfs.tar > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-complete-runtime-payload
          path: runtime-artifact/
          if-no-files-found: error
