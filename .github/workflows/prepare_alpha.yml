name: Prepare full Alpha integration
on:
  push:
    branches: [build/alpha-integration-bootstrap]
    paths: [.github/workflows/prepare_alpha.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full upstream Alpha and isolated runtime
        shell: bash
        run: |
          set -euo pipefail
          cp tools/alpha-integration/*.patch /tmp/
          target=integrate/alpha-full-base
          if git ls-remote --exit-code --heads origin "$target"; then
            echo "Integration branch already exists; refusing to replace it."
            exit 1
          fi
          git fetch --no-tags https://github.com/OrcaSlicer/OrcaSlicer.git refs/tags/v2.5.0-alpha
          test "$(git rev-parse FETCH_HEAD)" = 3880f2c58ec392ed2bd5938ab31c9c7c496c0eb2
          alpha=$(git rev-parse FETCH_HEAD)
          git checkout -b "$target" 3634a55f22f0fcf856839010f0d1db3940afa295
          git read-tree --reset -u "$alpha"
          # Import application sources only; preserve existing workflow permissions.
          git rm -r .github/workflows
          git checkout 3634a55f22f0fcf856839010f0d1db3940afa295 -- .github/workflows
          git checkout 3634a55f22f0fcf856839010f0d1db3940afa295 -- shared/slicer_linux_runtime_core src/slic3r/Utils/SlicerLinuxRuntime tools/slicer_linux_runtime tools/slicer_linux_runtime_host tools/slicer_linux_auth_helper
          git show 3634a55f22f0fcf856839010f0d1db3940afa295:src/slic3r/Utils/bambu_networking.hpp > shared/slicer_linux_runtime_core/RuntimeLegacyNetworking.hpp
          python3 - <<'PY'
          from pathlib import Path
          header = Path("shared/slicer_linux_runtime_core/RuntimeLegacyNetworking.hpp")
          header.write_text("// Private ABI for the separate 02.08.01 Linux host and its legacy forwarder.\n// Never include alongside the Alpha application's networking declarations.\n" + header.read_text())
          replacements = {
              "shared/slicer_linux_runtime_core/RuntimeCoreJson.hpp": ('../../src/slic3r/Utils/bambu_networking.hpp', 'RuntimeLegacyNetworking.hpp'),
              "tools/slicer_linux_runtime_host/LinuxRuntimeHost.cpp": ('../../src/slic3r/Utils/bambu_networking.hpp', '../../shared/slicer_linux_runtime_core/RuntimeLegacyNetworking.hpp'),
              "src/slic3r/Utils/SlicerLinuxRuntime/SlicerLinuxRuntimeForwarderState.hpp": ('../bambu_networking.hpp', '../../../../shared/slicer_linux_runtime_core/RuntimeLegacyNetworking.hpp'),
              "src/slic3r/Utils/SlicerLinuxRuntime/SlicerLinuxRuntimeConfig.cpp": ('../bambu_networking.hpp', '../../../../shared/slicer_linux_runtime_core/RuntimeLegacyNetworking.hpp'),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text()
              assert text.count('#include "' + old + '"') == 1, name
              path.write_text(text.replace('#include "' + old + '"', '#include "' + new + '"'))
          PY
          git add -A
          git apply --index /tmp/x1c-controls.patch
          git apply --index /tmp/runtime-identity.patch
          git diff --cached --exit-code 3634a55f22f0fcf856839010f0d1db3940afa295 -- .github/workflows
          git diff --exit-code 3880f2c58ec392ed2bd5938ab31c9c7c496c0eb2 -- src/slic3r/plugin
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/slicer_linux_runtime_core src/slic3r/Utils/SlicerLinuxRuntime tools/slicer_linux_runtime tools/slicer_linux_runtime_host tools/slicer_linux_auth_helper
          git commit -m "Import full Alpha 3880f2c source with X1C controls and isolated runtime"
          git push origin HEAD:"refs/heads/$target"
      - name: Install runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev libssl-dev libcurl4-openssl-dev zlib1g-dev nlohmann-json3-dev libwebkit2gtk-4.1-dev
      - name: Run runtime regression tests
        run: |
          python3 tools/slicer_linux_runtime/test_http_request.py
          python3 tools/slicer_linux_runtime/test_runtime_dispatcher.py
          python3 tools/slicer_linux_runtime/test_print_params.py
          python3 tools/slicer_linux_runtime/test_drying_controls.py
          python3 tools/slicer_linux_runtime/test_drying_status.py
          python3 tools/slicer_linux_runtime/test_nozzle_settings.py
      - name: Build runtime hosts and authentication browser
        run: |
          cmake -S tools/slicer_linux_runtime_host -B build-runtime -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-runtime --target slicer_linux_runtime_host --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-runtime-validation
          path: build-runtime/tools/slicer_linux_runtime_host/
          if-no-files-found: error
