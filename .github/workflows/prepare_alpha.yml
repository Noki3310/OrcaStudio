name: Prepare full Alpha integration
on:
  push:
    branches: [build/alpha-integration-bootstrap]
    paths: [.github/workflows/prepare_alpha.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2d0ade5cd040b3cbfc665298dd645522115b236c
      - name: Install runtime build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-dev libssl-dev libcurl4-openssl-dev zlib1g-dev nlohmann-json3-dev libwebkit2gtk-4.1-dev
      - name: Run runtime regression tests
        run: |
          python3 tools/slicer_linux_runtime/test_http_request.py
          python3 tools/slicer_linux_runtime/test_runtime_dispatcher.py
          python3 tools/slicer_linux_runtime/test_print_params.py
          python3 tools/slicer_linux_runtime/test_runtime_abi.py
          python3 tools/slicer_linux_runtime/test_drying_controls.py
          python3 tools/slicer_linux_runtime/test_drying_status.py
          python3 tools/slicer_linux_runtime/test_nozzle_settings.py
      - name: Build runtime hosts and authentication browser
        run: |
          cmake -S tools/slicer_linux_runtime_host -B build-runtime -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-runtime --target slicer_linux_runtime_host --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-runtime-validation
          path: build-runtime/tools/slicer_linux_runtime_host/
          if-no-files-found: error
