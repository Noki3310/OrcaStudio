name: Fehler melden
description: Fehler in der X1C Community Edition nachvollziehbar melden
title: '[Fehler] '
body:
  - type: markdown
    attributes:
      value: 'Bitte keine Zugangscodes, Tokens oder privaten Gerätedaten veröffentlichen.'
  - type: input
    id: version
    attributes:
      label: OrcaStudio-Version und Download
      description: Buildkennung oder Release-Link angeben.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Aufbau
      description: Windows-Version, Druckermodell/Firmware, AMS-Modell/Firmware, Filamentquelle (HT oder externe Spule), Verbindungsmodus.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Schritte, erwartetes und beobachtetes Verhalten
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Bereinigte Logs oder Screenshots
      description: Bei Trocknungsproblemen echte Geräteanzeige, Status und zeitlichen Ablauf ergänzen.
